# Checks a repo's ADRs and plans as the architecture site's build does
# (docs/plan/records-site): every plan has a valid front matter status, every
# ADR a status block, and every relative link and anchor resolves. Failures
# are annotations on the file and line.
#
# Use it after checking out the repo, pinned to a commit of this repo:
#
#   - uses: actions/checkout@<sha>
#   - uses: branes-ai/architecture/actions/check-records@<sha>
#
# The folders checked are `folders`, else the repo's in sources.yaml at that
# commit, else adr and plan. `folders` lets a repo check its records before it
# is listed (for example `folders: plans`). It sets up Node 22 for its own scripts.
name: Check architecture records
description: Checks the repo's ADRs and plans (status, titles, links) as the architecture site does.
inputs:
  path:
    description: The repo's working tree, relative to the workspace.
    default: '.'
  strict:
    description: "'true' makes a plan without a status an error, not a warning."
    default: 'false'
  folders:
    description: The folders under docs/ to check, comma-separated. Empty means the repo's in sources.yaml.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
      with:
        node-version: 22
    - name: Install the checker
      shell: bash
      run: npm ci --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH/../.."
    - name: Check the records
      shell: bash
      env:
        RECORDS_PATH: ${{ inputs.path }}
        RECORDS_STRICT: ${{ inputs.strict }}
        RECORDS_FOLDERS: ${{ inputs.folders }}
      run: |
        args=(--dir "$RECORDS_PATH")
        [ "$RECORDS_STRICT" = true ] && args+=(--strict)
        [ -n "$RECORDS_FOLDERS" ] && args+=(--folders "$RECORDS_FOLDERS")
        node "$GITHUB_ACTION_PATH/../../scripts/check-records.mjs" "${args[@]}"
