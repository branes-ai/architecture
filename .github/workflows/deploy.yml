name: Deploy

# Builds the site from every repo in sources.yaml and publishes it to GitHub
# Pages at https://branes-ai.github.io/architecture/ (docs/plan/records-site).
# It runs every hour, so a record merged in any repo is online within the
# hour; on a push to main; and by hand. The sources are public, so it needs no
# token. A failed build publishes nothing, and the last good site stays up.
#
# One-time setup (repo admin): Settings → Pages → Build and deployment →
# Source = "GitHub Actions".

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege globally; the deploy job opts into the Pages write scopes.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: site
      - name: Collect the records
        # Strict: a plan without a status fails the build.
        run: node scripts/collect.mjs --strict
      - name: Check that every record is published
        run: scripts/check-coverage.sh
      - name: Build the site
        working-directory: site
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
      - name: Check the site's internal links
        run: node scripts/check-site-links.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0
        with:
          path: site/dist

  deploy:
    # Only the deploy job needs the Pages write scopes.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
